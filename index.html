<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عدّاد الأيام</title>
<meta name="theme-color" content="#534AB7">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#534AB7; --purple-l:#EEEDFE; --purple-d:#26215C;
  --teal:#1D9E75; --teal-l:#E1F5EE; --teal-d:#04342C;
  --coral:#D85A30; --coral-l:#FAECE7; --coral-d:#4A1B0C;
  --blue:#378ADD; --blue-l:#E6F1FB; --blue-d:#042C53;
  --pink:#D4537E; --pink-l:#FBEAF0; --pink-d:#4B1528;
  --amber:#BA7517; --amber-l:#FAEEDA; --amber-d:#412402;
  --green:#639922; --green-l:#EAF3DE; --green-d:#173404;
  --gray:#888780; --gray-l:#F1EFE8; --gray-d:#2C2C2A;
  --bg:#F7F6F2; --card:#fff; --line:#E6E4DC;
  --txt:#22221F; --txt2:#6B6A64; --danger:#D33;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:16px;line-height:1.6;padding-bottom:40px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
button{font-family:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--txt);font-size:14px;padding:8px 14px;transition:.15s}
button:hover{border-color:#c9c7bd}
button:active{transform:scale(.97)}
.btn-primary{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:500}
.btn-primary:hover{background:#453ea0;border-color:#453ea0}
.btn-icon{width:38px;padding:8px 0;text-align:center}
#logoutBtn{display:flex;align-items:center;justify-content:center;color:var(--txt2)}
#logoutBtn:hover{color:var(--danger);border-color:var(--danger)}
.btn-danger{color:var(--danger)}
input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt)}
textarea{resize:vertical;min-height:84px;line-height:1.7}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-l)}
label{font-size:13px;color:var(--txt2);display:block;margin-bottom:4px}
.hide{display:none!important}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo{width:42px;height:42px;border-radius:12px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.brand h1{font-size:19px;margin:0;font-weight:600}
.brand p{margin:0;font-size:13px;color:var(--txt2)}
.hactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* dashboard stat cards */
.dash{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px;position:relative;min-height:104px;display:flex;flex-direction:column;justify-content:center}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.2}
.stat span{font-size:14px;color:var(--txt2)}
.stat.clk{cursor:pointer;border-color:transparent}
.stat.clk:hover{border-color:var(--purple)}
.stat.clk::after{content:'‹';position:absolute;top:12px;left:14px;font-size:22px;color:var(--txt2);line-height:1}
.stat.active{background:var(--purple-l)}
.stat.arch{background:var(--gray-l)}

.newbtn-row{margin-top:14px}
#newBtn{width:100%;padding:13px;font-size:16px}

/* back bar */
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.backbar h2{font-size:18px;font-weight:600;margin:0}
.back{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:#fff;border:1px solid var(--line);cursor:pointer}

/* list cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;cursor:pointer}
.card:hover{border-color:#c9c7bd}
.card:before{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:var(--c,var(--purple))}
.crow{display:flex;align-items:center;gap:14px}
.circle{width:70px;height:70px;flex:none;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cl);color:var(--cd)}
.circle.clk{cursor:pointer;position:relative}
.circle.clk:active{transform:scale(.94)}
.circle.clk::after{content:'⇄';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:10px;opacity:.5}
.circle b{font-size:22px;font-weight:700;line-height:1.1}
.circle span{font-size:11px;opacity:.85}
.cinfo{min-width:0;flex:1}
.ctitle{font-size:16px;font-weight:600;word-break:break-word}
.cdate{font-size:13px;color:var(--txt2);display:flex;align-items:center;gap:5px;margin-top:2px}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:8px;background:var(--gray-l);color:var(--gray-d);margin-top:4px}
.chev{position:absolute;bottom:14px;left:16px;color:var(--txt2);font-size:18px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--txt2)}

/* detail screen */
.detail-hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-align:center;position:relative;overflow:hidden;margin-bottom:16px}
.detail-hero:before{content:'';position:absolute;top:0;right:0;left:0;height:5px;background:var(--c,var(--purple))}
.detail-circle{width:120px;height:120px;margin:6px auto 12px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cl);color:var(--cd);cursor:pointer;position:relative}
.detail-circle:active{transform:scale(.97)}
.detail-circle b{font-size:40px;font-weight:700;line-height:1}
.detail-circle span{font-size:14px;opacity:.85;margin-top:2px}
.detail-circle small{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.55}
.units4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px auto 14px;max-width:420px}
.u4{background:var(--cl);color:var(--cd);border-radius:14px;padding:12px 4px;text-align:center}
.u4 b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.u4 span{font-size:12px;opacity:.85}
.detail-sub{font-size:13px;color:var(--txt2);margin-bottom:2px}
.detail-title{font-size:20px;font-weight:600;word-break:break-word}
.detail-date{font-size:14px;color:var(--txt2);margin-top:4px}
.detail-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.detail-panel h3{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--txt2)}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions-grid button{padding:12px;font-size:15px}
.act-full{grid-column:1/-1}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px}
.panel h3{margin:0 0 12px;font-size:16px;font-weight:600}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.types{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{flex:1;min-width:150px;font-size:14px}
.tbtn.on{background:var(--purple-l);border-color:var(--purple);color:var(--purple-d);font-weight:600}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--txt);transform:scale(1.1)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:var(--radius);padding:20px;width:100%;max-width:420px}
.modal h3{margin:0 0 14px;font-size:17px;font-weight:600}
.mact{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}

.auth{max-width:400px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}
.auth .logo{width:56px;height:56px;font-size:28px;margin:0 auto 14px}
.auth h2{text-align:center;margin:0 0 4px;font-size:20px;font-weight:600}
.auth p.sub{text-align:center;color:var(--txt2);font-size:14px;margin:0 0 20px}
.auth .f{margin-bottom:12px}
.err{background:#FCEBEB;color:#A32D2D;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:12px}
.link{background:none;border:none;color:var(--purple);font-size:14px;padding:6px;text-decoration:underline}
.toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:var(--txt);color:#fff;font-size:14px;padding:10px 18px;border-radius:12px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:520px){.wrap{padding:12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loading" class="wrap" style="text-align:center;padding-top:60px;color:var(--txt2)">جارٍ التحميل…</div>

<!-- ===== AUTH ===== -->
<div id="authView" class="wrap hide">
  <div class="auth">
    <div class="logo">📅</div>
    <h2>عدّاد الأيام</h2>
    <p class="sub" id="authSub">سجّل دخولك لمزامنة عدّاداتك على كل أجهزتك</p>
    <div id="authErr" class="err hide"></div>
    <div class="f"><label>البريد الإلكتروني</label><input type="email" id="email" autocomplete="email" placeholder="name@example.com"></div>
    <div class="f"><label>كلمة السر</label><input type="password" id="pass" autocomplete="current-password" placeholder="٦ أحرف على الأقل"></div>
    <button class="btn-primary" id="authBtn" style="width:100%;padding:11px;margin-top:6px">دخول</button>
    <div style="text-align:center;margin-top:10px">
      <button class="link" id="switchMode">ليس لديك حساب؟ أنشئ حساباً</button>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="appView" class="wrap hide">
  <header>
    <div class="brand" id="brandHome">
      <div class="logo">📅</div>
      <div>
        <h1>عدّاد الأيام</h1>
        <p id="subline">—</p>
      </div>
    </div>
    <div class="hactions">
      <button id="installBtn" class="hide">📲 تثبيت</button>
      <button class="btn-icon" id="logoutBtn" title="تسجيل الخروج" aria-label="تسجيل الخروج">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <!-- SCREEN: dashboard -->
  <div id="scrDash">
    <div class="dash">
      <div class="stat clk active" id="cardActive"><b id="stActive">0</b><span>عدّادات شغّالة</span></div>
      <div class="stat"><b id="stMax">—</b><span>الأطول</span></div>
      <div class="stat"><b id="stNext">—</b><span>أقرب هدف</span></div>
      <div class="stat clk arch" id="cardArch"><b id="stArch">0</b><span>مؤرشفة</span></div>
    </div>
    <div class="newbtn-row"><button class="btn-primary" id="newBtn">＋ عدّاد جديد</button></div>

    <div class="panel hide" id="addPanel" style="margin-top:16px">
      <h3>عدّاد جديد</h3>
      <div class="types" id="nTypes">
        <button class="tbtn on" data-t="up">↑ تصاعدي — منذ تاريخ</button>
        <button class="tbtn" data-t="down">↓ تنازلي — حتى تاريخ</button>
      </div>
      <div class="frow" style="margin-top:12px">
        <div><label>الموضوع</label><input type="text" id="nTitle" placeholder="مثال: وضعت الحمامة بيضة"></div>
        <div><label id="nDateLbl">تاريخ البداية</label><input type="date" id="nDate"></div>
      </div>
      <div style="margin-top:12px"><label>ملاحظات (اختياري)</label><textarea id="nNote" placeholder="أي تفاصيل تريد تذكّرها"></textarea></div>
      <label style="margin-top:12px">اللون</label>
      <div class="colors" id="nColors"></div>
      <div class="mact">
        <button class="btn-primary" id="saveNew">حفظ</button>
        <button id="cancelNew">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- SCREEN: list -->
  <div id="scrList" class="hide">
    <div class="backbar">
      <div class="back" data-nav="dash">›</div>
      <h2 id="listTitle">عدّاداتي</h2>
    </div>
    <div id="listGrid" class="grid"></div>
    <div id="listEmpty" class="empty hide"></div>
  </div>

  <!-- SCREEN: detail -->
  <div id="scrDetail" class="hide">
    <div class="backbar">
      <div class="back" data-nav="back">›</div>
      <h2>تفاصيل العدّاد</h2>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKtoT00gUVKeVPbGfOvYdwo0eewaNBCbM",
  authDomain: "ayyam-counter.firebaseapp.com",
  projectId: "ayyam-counter",
  storageBucket: "ayyam-counter.firebasestorage.app",
  messagingSenderId: "693871649414",
  appId: "1:693871649414:web:2fd243b659d0b70d176707"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const COLORS = ['purple','teal','coral','blue','pink','amber','green'];
const UNITS = ['day','week','month','year'];
const LS = 'ayyam_counters_v1';
let counters = [];
let uid = null, unsub = null, signup = false, newColor = 'purple', newType = 'up';
let screen = 'dash', listMode = 'active', currentId = null;

const $ = s => document.querySelector(s);
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const utc = iso => { const [y,m,d]=iso.split('-').map(Number); return Date.UTC(y,m-1,d); };
const days = iso => Math.floor((utc(todayISO())-utc(iso))/86400000)+1;
const daysLeft = iso => Math.floor((utc(iso)-utc(todayISO()))/86400000);
const nextUnit = u => UNITS[(UNITS.indexOf(u)+1) % UNITS.length] || 'week';
function completedUnits(nDays){
  const a = Math.abs(nDays);
  return {
    day:   a,
    week:  Math.floor(a/7),
    month: Math.floor(a/30.44),
    year:  Math.floor(a/365.25)
  };
}
function unitVal(nDays, unit){
  const a = Math.abs(nDays);
  if(unit==='week')  return { big: Math.max(1,Math.round(a/7)),      lbl:'أسبوع' };
  if(unit==='month') return { big: Math.max(1,Math.round(a/30.44)),  lbl:'شهر' };
  if(unit==='year')  return { big: Math.max(1,Math.round(a/365.25)), lbl:'سنة' };
  return { big:a, lbl:'يوم' };
}
const fmt = iso => { const [y,m,d]=iso.split('-'); return `${+d}/${+m}/${y}`; };
const uid4 = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- storage ---------- */
function loadLocal(){ try{ counters = JSON.parse(localStorage.getItem(LS)||'[]'); }catch{ counters=[]; } }
function saveLocal(){ localStorage.setItem(LS, JSON.stringify(counters)); }
async function pushCloud(){
  if(!uid) return;
  try{ await setDoc(doc(db,'counters',uid), { counters, updatedAt: Date.now() }); }
  catch(e){ toast('تعذّرت المزامنة — حُفظ محلياً'); }
}
async function save(){ saveLocal(); render(); pushCloud(); }
function autoArchive(){
  let ch=false;
  counters.forEach(c=>{ if(c.type==='down' && !c.archived && daysLeft(c.startDate)<=0){ c.archived=true; ch=true; } });
  return ch;
}

/* ---------- counter display ---------- */
function counterView(c){
  const down = c.type==='down';
  const unit = c.unit || 'day';
  let big, lbl, ended=false;
  if(down){
    const left = daysLeft(c.startDate);
    if(left>0){ const v=unitVal(left,unit); big=v.big; lbl=v.lbl+(unit==='day'?' متبقٍ':''); }
    else { big=0; lbl='انتهى'; ended=true; }
  } else {
    const v=unitVal(days(c.startDate),unit); big=v.big; lbl=v.lbl;
  }
  return { down, unit, big, lbl, ended };
}

/* ---------- navigation ---------- */
function go(scr){
  screen = scr;
  $('#scrDash').classList.toggle('hide', scr!=='dash');
  $('#scrList').classList.toggle('hide', scr!=='list');
  $('#scrDetail').classList.toggle('hide', scr!=='detail');
  window.scrollTo(0,0);
}
$('#brandHome').onclick = ()=>{ $('#addPanel').classList.add('hide'); go('dash'); };
document.addEventListener('click', e=>{
  const nav = e.target.closest('[data-nav]'); if(!nav) return;
  if(nav.dataset.nav==='dash') go('dash');
  else if(nav.dataset.nav==='back') go('list');
});

/* ---------- render ---------- */
function render(){
  if(autoArchive()){ saveLocal(); pushCloud(); }
  const act = counters.filter(c=>!c.archived);
  const arc = counters.filter(c=>c.archived);
  // dashboard stats
  $('#stActive').textContent = act.length;
  $('#stArch').textContent = arc.length;
  const mx = act.filter(c=>c.type!=='down').map(c=>days(c.startDate)).filter(n=>n>0);
  $('#stMax').textContent = mx.length ? Math.max(...mx)+' يوم' : '—';
  const nx = act.filter(c=>c.type==='down').map(c=>daysLeft(c.startDate)).filter(n=>n>0);
  $('#stNext').textContent = nx.length ? Math.min(...nx)+' يوم' : '—';
  $('#subline').textContent = act.length ? `${act.length} عدّاد شغّال` : 'ابدأ عدّادك الأول';
  if(screen==='list') renderList();
  if(screen==='detail') renderDetail();
}

function listCardHTML(c){
  const down = c.type==='down';
  let big, lbl;
  if(down){ const left=daysLeft(c.startDate); if(left>0){ big=left; lbl='يوم متبقٍ'; } else { big=0; lbl='انتهى'; } }
  else { big=days(c.startDate); lbl='يوم'; }
  const col = COLORS.includes(c.color) ? c.color : 'purple';
  const cvars = c.archived
    ? `--c:var(--gray);--cl:var(--gray-l);--cd:var(--gray-d)`
    : `--c:var(--${col});--cl:var(--${col}-l);--cd:var(--${col}-d)`;
  const info = c.archived
    ? `<div class="badge">${down ? 'انتهى — ' + fmt(c.startDate) : 'مؤرشف'}</div>`
    : `<div class="cdate">${down ? '🎯' : '⚑'} ${fmt(c.startDate)}</div>`;
  return `<div class="card" style="${cvars}" data-open="${c.id}">
    <div class="crow">
      <div class="circle"><b>${big}</b><span>${lbl}</span></div>
      <div class="cinfo">
        <div class="ctitle">${esc(c.title)}</div>
        ${info}
      </div>
    </div>
    <div class="chev">‹</div>
  </div>`;
}

function renderList(){
  const arch = listMode==='arch';
  $('#listTitle').textContent = arch ? 'العدّادات المؤرشفة' : 'عدّاداتي الشغّالة';
  let items = counters.filter(c=> arch ? c.archived : !c.archived);
  if(!arch) items.sort((a,b)=>{
    const ad=a.type==='down', bd=b.type==='down';
    if(ad!==bd) return ad?-1:1;
    return ad ? daysLeft(a.startDate)-daysLeft(b.startDate) : utc(a.startDate)-utc(b.startDate);
  });
  $('#listGrid').innerHTML = items.map(listCardHTML).join('');
  const empty = items.length===0;
  $('#listEmpty').classList.toggle('hide', !empty);
  $('#listEmpty').textContent = arch ? 'لا يوجد عدّادات مؤرشفة' : 'لا يوجد عدّادات شغّالة — ارجع وأضف عدّاداً';
}

function renderDetail(){
  const c = counters.find(x=>x.id===currentId);
  if(!c){ go('list'); return; }
  const v = counterView(c);
  const col = COLORS.includes(c.color) ? c.color : 'purple';
  const cvars = c.archived
    ? `--c:var(--gray);--cl:var(--gray-l);--cd:var(--gray-d)`
    : `--c:var(--${col});--cl:var(--${col}-l);--cd:var(--${col}-d)`;
  const dateLbl = v.down ? 'تاريخ الهدف' : 'تاريخ البداية';
  const rawN = v.down ? daysLeft(c.startDate) : days(c.startDate);
  const cu = completedUnits(rawN);
  const subTxt = v.down ? (v.ended ? '' : 'المتبقّي حتى الهدف') : 'مضى منذ البداية';
  const units4 = v.ended ? '' : `
    <div class="detail-sub">${subTxt}</div>
    <div class="units4">
      <div class="u4"><b>${cu.day}</b><span>يوم</span></div>
      <div class="u4"><b>${cu.week}</b><span>أسبوع</span></div>
      <div class="u4"><b>${cu.month}</b><span>شهر</span></div>
      <div class="u4"><b>${cu.year}</b><span>سنة</span></div>
    </div>`;
  let actions;
  if(c.archived && v.down)
    actions = `<button class="act-full" data-act="extend" data-id="${c.id}">⏩ تمديد الهدف</button>
      <button class="act-full btn-danger" data-act="delete" data-id="${c.id}">🗑 حذف</button>`;
  else if(c.archived)
    actions = `<button class="act-full" data-act="unarchive" data-id="${c.id}">▶ إرجاع للعمل</button>
      <button class="act-full btn-danger" data-act="delete" data-id="${c.id}">🗑 حذف</button>`;
  else
    actions = `<button data-act="${v.down?'extend':'reset'}" data-id="${c.id}">${v.down?'⏩ تمديد':'↻ تصفير'}</button>
      <button data-act="edit" data-id="${c.id}">✎ تعديل</button>
      <button data-act="archive" data-id="${c.id}">⏸ أرشفة</button>
      <button class="btn-danger" data-act="delete" data-id="${c.id}">🗑 حذف</button>`;
  const note = (c.note||'').trim();
  $('#detailBody').innerHTML = `
    <div class="detail-hero" style="${cvars}">
      ${v.ended ? `<div class="detail-circle"><b>—</b><span>انتهى</span></div>` : units4}
      <div class="detail-title">${esc(c.title)}</div>
      <div class="detail-date">${v.down?'🎯':'⚑'} ${dateLbl}: ${fmt(c.startDate)}</div>
    </div>
    <div class="detail-panel">
      <h3>ملاحظات</h3>
      <div id="noteView" style="white-space:pre-wrap;${note?'':'color:var(--txt2)'}">${note?esc(note):'لا توجد ملاحظات — اضغط «تعديل الملاحظات» للإضافة'}</div>
      <button style="margin-top:10px" data-act="note" data-id="${c.id}">✎ تعديل الملاحظات</button>
    </div>
    <div class="detail-panel">
      <h3>الإجراءات</h3>
      <div class="actions-grid">${actions}</div>
    </div>`;
}

/* ---------- open list / detail ---------- */
$('#cardActive').onclick = ()=>{ listMode='active'; go('list'); renderList(); };
$('#cardArch').onclick = ()=>{ listMode='arch'; go('list'); renderList(); };

document.addEventListener('click', e=>{
  // open detail
  const op = e.target.closest('[data-open]');
  if(op){ currentId=op.dataset.open; go('detail'); renderDetail(); return; }
  // actions
  const b = e.target.closest('[data-act]'); if(!b) return;
  const c = counters.find(x=>x.id===b.dataset.id); if(!c) return;
  const act = b.dataset.act;
  if(act==='reset') confirmBox(`تصفير «${c.title}»؟`, 'سيبدأ العدّ من جديد اليوم', ()=>{ c.startDate=todayISO(); save(); toast('تمّ التصفير'); });
  if(act==='archive'){ c.archived=true; save(); toast('تمّت الأرشفة'); go('list'); renderList(); }
  if(act==='unarchive'){ c.archived=false; save(); toast('رجع للعمل'); go('list'); renderList(); }
  if(act==='delete') confirmBox(`حذف «${c.title}»؟`, 'لا يمكن التراجع', ()=>{ counters=counters.filter(x=>x.id!==c.id); save(); toast('حُذف'); go('list'); renderList(); });
  if(act==='edit') editBox(c);
  if(act==='extend') extendBox(c);
  if(act==='note') noteBox(c);
});

/* ---------- modals ---------- */
function confirmBox(title, sub, onOk){
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><p style="color:var(--txt2);font-size:14px;margin:0">${esc(sub)}</p>
  <div class="mact"><button class="btn-primary" id="ok">تأكيد</button><button id="no">إلغاء</button></div></div>`;
  document.body.appendChild(o);
  o.querySelector('#ok').onclick=()=>{ onOk(); o.remove(); };
  o.querySelector('#no').onclick=()=>o.remove();
  o.onclick=e=>{ if(e.target===o) o.remove(); };
}
function editBox(c){
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="modal"><h3>تعديل العدّاد</h3>
    <div style="margin-bottom:12px"><label>الموضوع</label><input type="text" id="eT" value="${esc(c.title)}"></div>
    <div><label>${c.type==='down'?'تاريخ الهدف':'تاريخ البداية'}</label><input type="date" id="eD" value="${c.startDate}"></div>
    <label style="margin-top:12px">اللون</label><div class="colors" id="eC"></div>
    <div class="mact"><button class="btn-primary" id="ok">حفظ</button><button id="no">إلغاء</button></div></div>`;
  document.body.appendChild(o);
  let col=c.color;
  const box=o.querySelector('#eC');
  box.innerHTML=COLORS.map(k=>`<div class="sw ${k===col?'on':''}" data-c="${k}" style="background:var(--${k})"></div>`).join('');
  box.onclick=e=>{ const sw=e.target.closest('.sw'); if(!sw)return; col=sw.dataset.c; box.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x.dataset.c===col)); };
  o.querySelector('#ok').onclick=()=>{
    const t=o.querySelector('#eT').value.trim(), d=o.querySelector('#eD').value;
    if(!t||!d){ toast('املأ الموضوع والتاريخ'); return; }
    if(c.type==='down' && utc(d) <= utc(todayISO())){ toast('العدّاد التنازلي يحتاج تاريخاً في المستقبل'); return; }
    c.title=t; c.startDate=d; c.color=col; save(); o.remove(); toast('تمّ التعديل');
  };
  o.querySelector('#no').onclick=()=>o.remove();
  o.onclick=e=>{ if(e.target===o) o.remove(); };
}
function extendBox(c){
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="modal"><h3>تمديد «${esc(c.title)}»</h3>
    <div><label>تاريخ الهدف الجديد</label><input type="date" id="xD" value="${c.startDate}"></div>
    <div class="mact"><button class="btn-primary" id="ok">حفظ</button><button id="no">إلغاء</button></div></div>`;
  document.body.appendChild(o);
  o.querySelector('#ok').onclick=()=>{
    const d=o.querySelector('#xD').value;
    if(!d){ toast('اختر تاريخاً'); return; }
    if(utc(d) <= utc(todayISO())){ toast('اختر تاريخاً في المستقبل'); return; }
    c.startDate=d; c.archived=false; save(); o.remove(); toast('تمّ التمديد');
  };
  o.querySelector('#no').onclick=()=>o.remove();
  o.onclick=e=>{ if(e.target===o) o.remove(); };
}
function noteBox(c){
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="modal"><h3>ملاحظات «${esc(c.title)}»</h3>
    <textarea id="nt" placeholder="اكتب ملاحظاتك">${esc(c.note||'')}</textarea>
    <div class="mact"><button class="btn-primary" id="ok">حفظ</button><button id="no">إلغاء</button></div></div>`;
  document.body.appendChild(o);
  o.querySelector('#nt').focus();
  o.querySelector('#ok').onclick=()=>{ c.note=o.querySelector('#nt').value; save(); o.remove(); toast('حُفظت الملاحظات'); };
  o.querySelector('#no').onclick=()=>o.remove();
  o.onclick=e=>{ if(e.target===o) o.remove(); };
}

/* ---------- add panel ---------- */
function paintColors(){ $('#nColors').innerHTML = COLORS.map(k=>`<div class="sw ${k===newColor?'on':''}" data-c="${k}" style="background:var(--${k})"></div>`).join(''); }
$('#nColors').onclick = e=>{ const sw=e.target.closest('.sw'); if(!sw)return; newColor=sw.dataset.c; paintColors(); };
function paintTypes(){
  document.querySelectorAll('#nTypes .tbtn').forEach(b=>b.classList.toggle('on', b.dataset.t===newType));
  $('#nDateLbl').textContent = newType==='down' ? 'تاريخ الهدف' : 'تاريخ البداية';
}
$('#nTypes').onclick = e=>{ const b=e.target.closest('.tbtn'); if(!b)return; newType=b.dataset.t; paintTypes(); };
$('#newBtn').onclick = ()=>{
  $('#addPanel').classList.remove('hide');
  $('#nTitle').value=''; $('#nNote').value=''; $('#nDate').value=todayISO();
  newType='up'; paintTypes();
  newColor = COLORS[counters.length % COLORS.length]; paintColors();
  $('#nTitle').focus();
};
$('#cancelNew').onclick = ()=> $('#addPanel').classList.add('hide');
$('#saveNew').onclick = ()=>{
  const t=$('#nTitle').value.trim(), d=$('#nDate').value, note=$('#nNote').value;
  if(!t){ toast('اكتب موضوع العدّاد'); return; }
  if(!d){ toast('اختر التاريخ'); return; }
  if(newType==='down' && utc(d) <= utc(todayISO())){ toast('العدّاد التنازلي يحتاج تاريخاً في المستقبل'); return; }
  counters.push({ id:uid4(), title:t, startDate:d, type:newType, unit:'day', color:newColor, note, archived:false, createdAt:Date.now() });
  $('#addPanel').classList.add('hide'); save(); toast('أُضيف العدّاد');
};

/* ---------- auth ---------- */
$('#switchMode').onclick = ()=>{
  signup = !signup;
  $('#authBtn').textContent = signup ? 'إنشاء حساب' : 'دخول';
  $('#switchMode').textContent = signup ? 'لديك حساب؟ سجّل دخولك' : 'ليس لديك حساب؟ أنشئ حساباً';
  $('#authSub').textContent = signup ? 'أنشئ حساباً لحفظ عدّاداتك في السحابة' : 'سجّل دخولك لمزامنة عدّاداتك على كل أجهزتك';
  $('#authErr').classList.add('hide');
};
$('#authBtn').onclick = async ()=>{
  const em=$('#email').value.trim(), pw=$('#pass').value;
  const err=$('#authErr'); err.classList.add('hide');
  if(!em||!pw){ err.textContent='املأ البريد وكلمة السر'; err.classList.remove('hide'); return; }
  $('#authBtn').disabled=true;
  try{
    if(signup) await createUserWithEmailAndPassword(auth,em,pw);
    else await signInWithEmailAndPassword(auth,em,pw);
  }catch(ex){
    const m={'auth/invalid-credential':'البريد أو كلمة السر غير صحيحة','auth/email-already-in-use':'هذا البريد مسجّل مسبقاً','auth/weak-password':'كلمة السر قصيرة (٦ أحرف على الأقل)','auth/invalid-email':'صيغة البريد غير صحيحة','auth/network-request-failed':'لا يوجد اتصال بالإنترنت'};
    err.textContent = m[ex.code] || 'تعذّر تسجيل الدخول'; err.classList.remove('hide');
  }
  $('#authBtn').disabled=false;
};
$('#pass').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#authBtn').click(); });
$('#logoutBtn').onclick = ()=> confirmBox('تسجيل الخروج؟','عدّاداتك محفوظة في السحابة',()=>signOut(auth));

onAuthStateChanged(auth, user=>{
  $('#loading').classList.add('hide');
  if(unsub){ unsub(); unsub=null; }
  if(!user){
    uid=null; counters=[]; go('dash');
    $('#appView').classList.add('hide'); $('#authView').classList.remove('hide');
    return;
  }
  uid = user.uid;
  $('#authView').classList.add('hide'); $('#appView').classList.remove('hide');
  loadLocal(); go('dash'); render();
  unsub = onSnapshot(doc(db,'counters',uid), snap=>{
    if(snap.exists() && Array.isArray(snap.data().counters)){ counters = snap.data().counters; saveLocal(); render(); }
    else if(counters.length){ pushCloud(); }
  }, ()=> toast('تعذّر الاتصال بالسحابة — تعمل محلياً'));
});

/* ---------- PWA ---------- */
let deferred=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferred=e; $('#installBtn').classList.remove('hide'); });
$('#installBtn').onclick = async ()=>{ if(!deferred)return; deferred.prompt(); await deferred.userChoice; deferred=null; $('#installBtn').classList.add('hide'); };
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

let lastDay = todayISO();
setInterval(()=>{ if(todayISO()!==lastDay){ lastDay=todayISO(); render(); } }, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) render(); });
</script>
</body>
</html>
